<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071D49"><link rel="manifest" href="../manifest.webmanifest"><title>Branch Locations — POA Customers</title><link rel="stylesheet" href="../assets/style.css?v=20261017-final-batch"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.0"></script>
<style>
.gm-locations-page{max-width:820px;margin:0 auto;padding:30px 18px 116px}.gm-locations-header{margin-bottom:20px}.gm-locations-title{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:34px;color:var(--green)}.gm-locations-subtitle{margin:7px 0 0;color:var(--muted);font-size:13px}.branch-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}.branch-form .field{min-width:0}.branch-form .full{grid-column:1/-1}.branch-list{display:grid;gap:12px}.branch-manage-card{background:var(--surface,#fffdf8);border:1px solid var(--line);border-radius:16px;padding:16px}.branch-card-top{display:flex;align-items:flex-start;gap:12px}.branch-card-icon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:0 0 42px;background:#edf1e8;color:var(--green);font-size:20px}.branch-card-title{margin:0;color:var(--green);font-size:17px}.branch-card-meta{display:block;margin-top:4px;color:var(--muted);font-size:12px;line-height:1.5;overflow-wrap:anywhere}.branch-card-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.branch-active{display:flex;align-items:center;gap:8px;margin:10px 0 14px;color:var(--text);font-size:12px;font-weight:700}.branch-active input{width:16px;height:16px}.branch-message{margin-top:10px;white-space:pre-wrap}.branch-empty{padding:22px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);text-align:center}.gm-locations-page .btn{cursor:pointer}@media(max-width:560px){.gm-locations-page{padding:25px 14px 112px}.gm-locations-title{font-size:30px}.branch-form{grid-template-columns:1fr}.branch-form .full{grid-column:auto}}
</style></head>
<body data-page="gm-locations">
<header class="topbar"><a class="brand brand-image" href="gm-dashboard.html"><img class="brand-logo" src="../assets/poac-logo-icon.png" alt="POAC SOFTWARE SOLUTIONS"></a><button class="icon" onclick="logout()" title="Sign out" aria-label="Sign out">↪</button></header>
<main class="gm-locations-page"><header class="gm-locations-header"><h1 class="gm-locations-title">Branch Locations</h1><p class="gm-locations-subtitle">Add and manage the real branches shown to customers.</p></header>
<section class="card"><h3 id="gmLocationFormTitle">Add Branch Location</h3><input id="gmLocationId" type="hidden"><div class="branch-form">
<div class="field full"><label for="gmLocationName">Branch name *</label><input class="input" id="gmLocationName" maxlength="100" placeholder="e.g. Al Ain Branch" required></div>
<div class="field"><label for="gmLocationCity">City / Area</label><input class="input" id="gmLocationCity" maxlength="100" placeholder="e.g. Al Ain"></div>
<div class="field"><label for="gmLocationPhone">Phone (optional)</label><input class="input" id="gmLocationPhone" type="tel" maxlength="40" placeholder="Branch phone number"></div>
<div class="field full"><label for="gmLocationAddress">Address</label><input class="input" id="gmLocationAddress" maxlength="250" placeholder="Street, building, area"></div>
<div class="field full"><label for="gmLocationMapsUrl">Google Maps link (optional)</label><input class="input" id="gmLocationMapsUrl" type="url" maxlength="1000" placeholder="Paste the branch's Google Maps link"></div>
</div><label class="branch-active"><input id="gmLocationActive" type="checkbox" checked> Active and visible to customers</label><div class="g2"><button class="btn primary" id="gmLocationSaveBtn" type="button">SAVE BRANCH</button><button class="btn" id="gmLocationCancelBtn" type="button" hidden>CANCEL EDIT</button></div><div id="gmLocationMessage" class="note branch-message" role="status" aria-live="polite"></div></section>
<section class="card"><div class="row" style="justify-content:space-between;align-items:center;gap:12px"><h3 style="margin:0">Current Branches</h3><button class="btn soft" id="gmLocationRefreshBtn" type="button">REFRESH</button></div><div class="branch-list" id="gmLocationsList" style="margin-top:14px"><div class="branch-empty">Loading branches…</div></div></section></main>
<nav class="nav"><div class="navin"><a href="gm-dashboard.html"><b>▦</b>Dashboard</a><a href="gm-orders.html"><b>▣</b>Orders</a><a href="gm-menu.html"><b>☰</b>Menu</a><a href="gm-settings.html" class="active"><b>⚙</b>Settings</a></div></nav>
<script src="../assets/config.js?v=20261019-currency-egp"></script><script src="../assets/app.js?v=20261019-reward-image-fallback"></script><script>if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('../sw.js').catch(()=>{}));}</script>
</body></html>
