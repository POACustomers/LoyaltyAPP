<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#073a2b"><link rel="manifest" href="../manifest.webmanifest"><title>POA Customers — Categories</title><link rel="stylesheet" href="../assets/style.css?v=20261017-images-categories"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.0"></script></head>
<body data-page="gm-categories"><header class="topbar"><a class="brand brand-image" href="gm-settings.html"><img class="brand-logo" src="../assets/poa-logo.svg" alt="POA CUSTOMERS"></a><button class="icon" onclick="logout()" title="Sign out">↪</button></header>
<main class="container" style="padding-bottom:110px"><p class="eyebrow">GM MANAGEMENT</p><h1 class="title">Categories</h1><p class="sub">Add, edit, and organize the menu categories shown to customers.</p>
<section class="card"><h3 id="formTitle">Add Category</h3><input id="categoryId" type="hidden"><div class="field"><label for="categoryName">Category name *</label><input id="categoryName" class="input" maxlength="80" placeholder="e.g. Hot Coffee" required></div><div class="field"><label for="categoryImage">Image URL (optional)</label><input id="categoryImage" class="input" type="url" placeholder="https://…"><small class="sub">Use a public HTTPS image URL. If empty, the menu shows a category icon.</small></div><div id="imagePreviewWrap" hidden style="margin:10px 0"><img id="imagePreview" alt="Category image preview" style="width:100%;max-width:220px;height:120px;object-fit:cover;border-radius:14px;background:#f4eee3"><p id="imagePreviewError" class="note" hidden>Image unavailable; check the URL.</p></div><div class="field"><label for="categoryIcon">Fallback icon</label><input id="categoryIcon" class="input" maxlength="8" value="☕" placeholder="☕"></div><div class="field"><label for="categoryOrder">Display order</label><input id="categoryOrder" class="input" type="number" min="0" step="1" value="0"></div><label style="display:flex;gap:8px;align-items:center;margin:12px 0"><input id="categoryActive" type="checkbox" checked> Active and visible to customers</label><div class="g2"><button id="saveCategory" class="btn primary">SAVE CATEGORY</button><button id="resetCategory" class="btn">CLEAR FORM</button></div><div id="categoryMsg" class="note" role="status" aria-live="polite"></div></section>
<section class="card"><div class="row" style="justify-content:space-between;align-items:center"><h3>Current Categories</h3><button id="refreshCategories" class="btn">REFRESH</button></div><div id="categoriesList"><div class="empty">Loading categories…</div></div></section></main>
<nav class="nav"><div class="navin"><a href="gm-dashboard.html"><b>▦</b>Dashboard</a><a href="gm-members.html"><b>♙</b>Customers</a><a href="gm-menu.html"><b>☰</b>Menu</a><a href="gm-settings.html" class="active"><b>⚙</b>Settings</a></div></nav>
<script src="../assets/config.js?v=20261017-images-categories"></script><script src="../assets/app.js?v=20261017-images-categories"></script>
<script>
(()=>{const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));let rows=[];
function message(t,bad=false){$('categoryMsg').textContent=t;$('categoryMsg').style.color=bad?'#a33':'inherit'}
function reset(){ $('categoryId').value='';$('categoryName').value='';$('categoryImage').value='';$('categoryIcon').value='☕';$('categoryOrder').value=String(rows.length*10);$('categoryActive').checked=true;$('formTitle').textContent='Add Category';$('saveCategory').textContent='SAVE CATEGORY';preview();message(''); }
function preview(){const url=$('categoryImage').value.trim();$('imagePreviewWrap').hidden=!url;$('imagePreviewError').hidden=true;if(url){$('imagePreview').onerror=()=>{$('imagePreviewError').hidden=false};$('imagePreview').onload=()=>{$('imagePreviewError').hidden=true};$('imagePreview').src=url}else $('imagePreview').removeAttribute('src')}
async function load(){const {data,error}=await sb.from('menu_categories').select('id,name,image_url,icon,sort_order,status,is_active,created_at').order('sort_order',{ascending:true});if(error){$('categoriesList').innerHTML='<div class="alert">'+esc(error.message)+'<br>Run <b>POACustomers-menu-categories-setup.sql</b> in the Supabase SQL Editor, then refresh.</div>';return}rows=data||[];$('categoriesList').innerHTML=rows.length?rows.map(r=>'<article class="reward" style="align-items:center">'+(r.image_url?'<img class="reward-product-image" src="'+esc(r.image_url)+'" alt="" onerror="this.hidden=true">':'<div class="food">'+esc(r.icon||'☕')+'</div>')+'<div class="grow"><strong>'+esc(r.name)+'</strong><small>Order: '+Number(r.sort_order||0)+' · '+((r.is_active===false||r.status==='inactive')?'Inactive':'Active')+'</small></div><button class="btn" data-edit="'+esc(r.id)+'">EDIT</button><button class="btn danger" data-delete="'+esc(r.id)+'">DELETE</button></article>').join(''):'<div class="empty">No categories yet. Add the first category above.</div>';$('categoriesList').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit));$('categoriesList').querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>del(b.dataset.delete))}
function edit(id){const r=rows.find(x=>x.id===id);if(!r)return;$('categoryId').value=r.id;$('categoryName').value=r.name||'';$('categoryImage').value=r.image_url||'';$('categoryIcon').value=r.icon||'☕';$('categoryOrder').value=String(r.sort_order||0);$('categoryActive').checked=r.is_active!==false&&r.status!=='inactive';$('formTitle').textContent='Edit Category';$('saveCategory').textContent='SAVE CHANGES';preview();window.scrollTo({top:0,behavior:'smooth'})}
async function del(id){const r=rows.find(x=>x.id===id);if(!r||!confirm('Delete category “'+r.name+'”? Categories that still contain menu items may be protected by the database.'))return;const {error}=await sb.from('menu_categories').delete().eq('id',id);if(error){message('Could not delete category: '+error.message,true);return}message('Category deleted.');reset();await load()}
$('categoryImage').addEventListener('input',preview);$('resetCategory').onclick=reset;$('refreshCategories').onclick=load;$('saveCategory').onclick=async()=>{const name=$('categoryName').value.trim();if(!name){message('Category name is required.',true);return}const id=$('categoryId').value;const active=$('categoryActive').checked;const payload={name,image_url:$('categoryImage').value.trim()||null,icon:$('categoryIcon').value.trim()||'☕',sort_order:Math.max(0,Number($('categoryOrder').value)||0),is_active:active,status:active?'active':'inactive'};$('saveCategory').disabled=true;try{const result=id?await sb.from('menu_categories').update(payload).eq('id',id):await sb.from('menu_categories').insert(payload);if(result.error)throw result.error;message(id?'Category updated successfully.':'Category added successfully.');reset();await load()}catch(e){message(e.message||'Could not save category.',true)}finally{$('saveCategory').disabled=false}};
load();
})();
</script><script>if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('../sw.js').catch(()=>{}));}</script></body></html>
