<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#073a2b">
<link rel="manifest" href="../manifest.webmanifest">
<title>Create Loyalty Account</title>
<link rel="stylesheet" href="../assets/style.css?v=20261017-final-batch">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.0"></script><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body data-page="customer-register">

<div class="auth"><div class="authbox">
<div class="logo"><img class="official-logo" src="../assets/poa-logo.svg" alt="POA CUSTOMERS"></div>
<h2>Create Account</h2><p class="sub">Create your POA Customers Loyalty account using a username and password. Phone and date of birth are optional.</p>
<div class="field"><label>Username</label><input id="username" class="input" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" minlength="3" maxlength="24" placeholder="Choose a username (3–24 characters)"></div>
<div class="field"><label>Mobile Number (Optional)</label><input id="phone" class="input" type="tel" autocomplete="tel" placeholder="+971 ... (optional)"></div>
<div class="field"><label>Date of Birth (Optional)</label><input id="birthday" class="input" type="date" autocomplete="bday"></div>
<div class="field"><label>Password</label><input id="password" class="input" type="password" autocomplete="new-password" minlength="6" placeholder="At least 6 characters"></div>
<button id="registerBtn" class="btn primary block">Create My Loyalty Account →</button>
<div id="msg" class="note"></div>
<div class="center" style="margin-top:14px"><a href="customer-login.html" class="sub">Already have an account? Sign in</a></div>
</div></div>

<script src="../assets/config.js?v=20260925-final"></script>
<script src="../assets/app.js?v=20261017-final-batch"></script>

<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("../sw.js").catch(()=>{}));}</script>
</body>
</html>
