<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#C65F78">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../assets/icons/icon-192.png?v=20261024-presale-candidate">
<title>Customer Home</title>
<link rel="stylesheet" href="../assets/style.css?v=20261024-offer-banner-image-v2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dina's Corner">
</head>
<body data-page="customer-home">

<header class="topbar customer-topbar">
<a class="brand brand-image" href="customer-home.html" aria-label="Dina's Corner Home"><img class="brand-logo" src="../assets/dina-corner-icon.png?v=20261024-presale-candidate" alt="DINA'S CORNER"></a>
<details class="customer-top-menu" data-customer-top-menu>
  <summary aria-label="Open customer navigation" title="Open customer navigation"><svg class="customer-top-menu-symbol" aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path d="M4 6h16M4 12h16M4 18h16" /></svg></summary>
  <nav class="customer-menu-popup" aria-label="Customer menu">
    <a href="customer-home.html" data-customer-link><span aria-hidden="true" class="customer-menu-icon">⌂</span><span>Home</span></a>
    <a href="customer-menu.html" data-customer-link><span aria-hidden="true" class="customer-menu-icon">☰</span><span>Menu &amp; Basket</span></a>
    <a href="customer-card.html" data-customer-link><span aria-hidden="true" class="customer-menu-icon">▦</span><span>My QR Code</span></a>
    <a href="customer-rewards.html" data-customer-link><span aria-hidden="true" class="customer-menu-icon">★</span><span>Rewards</span></a>
    <a href="customer-locations.html" data-customer-link><span aria-hidden="true" class="customer-menu-icon">⌖</span><span>Branches</span></a>
    <a href="customer-order-history.html" data-customer-link><span aria-hidden="true" class="customer-menu-icon">▣</span><span>Order History</span></a>
    <a href="customer-profile.html" data-customer-link><span aria-hidden="true" class="customer-menu-icon">●</span><span>My Profile</span></a>
  <button class="customer-menu-logout" type="button" onclick="logout()" aria-label="Sign out">Sign Out</button></nav>
</details>
</header>
<main class="container">
<section class="hero customer-loyalty-card" aria-label="Customer loyalty card">
  <div class="customer-loyalty-balance">
    <small>YOUR POINTS</small>
    <strong><span data-points>0</span> / 50</strong>
    <span class="customer-loyalty-hint">Keep earning brighter rewards</span>
  </div>
  <div class="customer-loyalty-member">
    <div class="customer-loyalty-identity">
      <small>Loyal Customer</small>
      <h2>Hello, <span data-name>Customer</span></h2>
      <p>Welcome back</p>
    </div>
    <a href="customer-profile.html" class="avatar-link customer-loyalty-avatar-link" aria-label="Edit profile">
      <div id="homeAvatar" class="avatar avatar-photo">AN</div>
    </a>
  </div>
</section>

<section id="homeOffersCard" class="card home-offers-card" style="margin-top:18px" aria-live="polite">
  <div id="homeOffersContent" class="home-offers-fallback" aria-live="polite">
    <h3>Special Offers</h3>
    <p class="sub">Loading current offers…</p>
  </div>
</section>

<section class="card home-categories-card" aria-labelledby="homeCategoriesTitle">
  <div class="home-categories-heading">
    <h3 id="homeCategoriesTitle">Browse Categories</h3>
    <a href="customer-menu.html" class="home-all-menu-link">Browse full menu <span aria-hidden="true">→</span></a>
  </div>
  <div id="homeMenuCategories" class="home-menu-categories" aria-live="polite">
    <div class="home-category-message">Loading categories…</div>
  </div>
</section>

</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.0"></script>
<script src="../assets/tenant-config.js?v=20261024-qr-share-v1"></script>
<script src="../assets/tenant-branding.js?v=20261024-qr-share-v1"></script>
<script src="../assets/customer-navigation.js?v=20261024-qr-share-v1"></script>
<script src="../assets/config.js?v=20261024-qr-share-v1"></script>
<script src="../assets/app.js?v=20261024-offer-banner-image-v2"></script>
<script src="../assets/customer-home-categories.js?v=20261024-home-categories-v1"></script>


</body>
</html>
