<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#C65F78">
<meta name="description" content="Dina's Corner Menu">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../assets/icons/icon-192.png">
<title>Dina's Corner Menu</title>
<link rel="stylesheet" href="../assets/style.css?v=20261024-no-bottom-nav-home-cards-v1">
<link rel="stylesheet" href="../assets/menu-display.css?v=20261024-menu-compact-v1">
<link rel="stylesheet" href="../assets/pickup-orders.css?v=20261024-offer-order-bottomnav-v1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dina's Corner">
</head>
<body data-page="customer-menu">
<header class="topbar customer-topbar">
<a class="brand brand-image" href="customer-home.html" aria-label="Dina's Corner Home"><img class="brand-logo" src="../assets/dina-corner-icon.png" alt="DINA'S CORNER"></a>
<div class="customer-header-actions">
  <button class="menu-cart-trigger" id="menuCartButton" type="button" aria-label="Open shopping basket" aria-haspopup="dialog" aria-controls="menu-cart">
    <span class="menu-cart-trigger-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" focusable="false"><path d="M3 4h2l2.2 11.1a2 2 0 0 0 2 1.6h8.9a2 2 0 0 0 1.9-1.4L22 8H6"/><circle cx="10" cy="20" r="1.2"/><circle cx="18" cy="20" r="1.2"/></svg>
      <span class="menu-cart-trigger-count" id="menuCartButtonCount" hidden>0</span>
    </span>
    <span class="menu-cart-trigger-total" id="menuCartButtonTotal">Basket</span>
  </button>
<details class="customer-top-menu" data-customer-top-menu>
  <summary aria-label="Open customer navigation" title="Open customer navigation"><svg class="customer-top-menu-symbol" aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path d="M4 6h16M4 12h16M4 18h16" /></svg></summary>
  <nav class="customer-menu-popup" aria-label="Customer menu">
    <a href="customer-home.html" data-customer-link><span aria-hidden="true" class="customer-menu-icon">⌂</span><span>Home</span></a>
    <a href="customer-menu.html" data-customer-link><span aria-hidden="true" class="customer-menu-icon">☰</span><span>Menu &amp; Basket</span></a>
    <a href="customer-card.html" data-customer-link><span aria-hidden="true" class="customer-menu-icon">▦</span><span>My QR Code</span></a>
    <a href="customer-rewards.html" data-customer-link><span aria-hidden="true" class="customer-menu-icon">★</span><span>Rewards</span></a>
    <a href="customer-locations.html" data-customer-link><span aria-hidden="true" class="customer-menu-icon">⌖</span><span>Branches</span></a>
    <a href="customer-order-history.html" data-customer-link><span aria-hidden="true" class="customer-menu-icon">▣</span><span>Order History</span></a>
    <a href="customer-profile.html" data-customer-link><span aria-hidden="true" class="customer-menu-icon">●</span><span>My Profile</span></a>
  <button class="customer-menu-logout" type="button" onclick="logout()" aria-label="Sign out">Sign Out</button></nav>
</details>
</div>
</header>

<div id="menuCartBackdrop" class="menu-cart-backdrop" hidden aria-hidden="true">
  <section id="menu-cart" class="menu-cart-drawer card" role="dialog" aria-modal="true" aria-labelledby="menuCartTitle" tabindex="-1" aria-live="polite"></section>
</div>

<main class="container menu-page">
  <div class="menu-hero">
    <p class="eyebrow">DINA'S CORNER</p>
    <h1 class="title">Our Menu</h1>
    <p class="sub">Choose a category to view the available items.</p>
  </div>

  <section class="menu-panel card" aria-label="Menu">
    <div id="menuCategoriesView">
      <div class="menu-loading">Loading menu…</div>
    </div>
    <div id="menuItemsView" hidden></div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.0"></script>
<script src="../assets/tenant-config.js?v=20261024-offer-order-bottomnav-v1"></script>
<script src="../assets/tenant-branding.js?v=20261024-offer-order-bottomnav-v1"></script>
<script src="../assets/customer-navigation.js?v=20261024-no-bottom-nav-home-cards-v1"></script>
<script src="../assets/config.js?v=20261024-offer-order-bottomnav-v1"></script>
<script src="../assets/app.js?v=20261024-offer-order-bottomnav-v1"></script>
<script src="../assets/pickup-orders.js?v=20261024-offer-order-bottomnav-v1"></script>



<script src="../assets/menu-display.js?v=20261024-offer-order-bottomnav-v1"></script>

<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('../sw.js').catch(()=>{}));}
</script>
</body>
</html>
