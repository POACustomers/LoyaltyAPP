<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#C65F78">
<meta name="description" content="View your previous Dina's Corner orders and their status.">
<link rel="manifest" href="../manifest-customer.webmanifest">
<link rel="apple-touch-icon" href="../assets/icons/icon-192.png">
<title>Order History</title>
<link rel="stylesheet" href="../assets/style.css?v=20261021-top-menu">
<link rel="stylesheet" href="../assets/pickup-orders.css?v=20261021-top-menu">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dina's Corner">
<style>
.customer-history-main{max-width:940px;margin:0 auto;padding:24px 16px 28px}
.customer-history-panel{margin-top:16px}
.customer-history-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.customer-history-heading h2{margin:0}
@media(max-width:560px){.customer-history-main{padding:18px 12px 24px}.customer-history-panel{padding:14px}}
</style>
</head>
<body data-page="customer-order-history">
<header class="topbar customer-topbar">
<a class="brand brand-image" href="customer-home.html" aria-label="Dina's Corner Home"><img class="brand-logo" src="../assets/dina-corner-icon.png" alt="DINA'S CORNER"></a>
<details class="customer-top-menu" data-customer-top-menu>
  <summary aria-label="Open customer navigation"><span class="customer-top-menu-symbol" aria-hidden="true">☰</span><span class="customer-top-menu-label">Menu</span></summary>
  <nav class="customer-menu-popup" aria-label="Customer menu">
    <a href="customer-home.html" data-customer-link><span aria-hidden="true" class="customer-menu-icon">⌂</span><span>Home</span></a>
    <a href="customer-menu.html" data-customer-link><span aria-hidden="true" class="customer-menu-icon">☰</span><span>Menu</span></a>
    <a href="customer-orders.html" data-customer-link><span aria-hidden="true" class="customer-menu-icon">🛒</span><span>Basket &amp; Checkout</span></a>
    <a href="customer-rewards.html" data-customer-link><span aria-hidden="true" class="customer-menu-icon">★</span><span>Rewards</span></a>
    <a href="customer-locations.html" data-customer-link><span aria-hidden="true" class="customer-menu-icon">⌖</span><span>Branches</span></a>
    <a href="customer-order-history.html" data-customer-link><span aria-hidden="true" class="customer-menu-icon">▣</span><span>Order History</span></a>
    <a href="customer-profile.html" data-customer-link><span aria-hidden="true" class="customer-menu-icon">●</span><span>My Profile</span></a>
  </nav>
</details>
<button class="icon" type="button" onclick="logout()" title="Sign out" aria-label="Sign out">↪</button>
</header>
<main class="customer-history-main">
  <header class="pickup-heading">
    <p class="eyebrow">YOUR ACCOUNT</p>
    <h1 class="title">Order History</h1>
    <p class="sub">Review previous orders, branch details, totals and the latest recorded status.</p>
  </header>
  <section class="card pickup-panel customer-history-panel" aria-labelledby="customerHistoryTitle">
    <div class="customer-history-heading"><h2 id="customerHistoryTitle">Previous orders</h2><button id="refreshPickupOrdersBtn" class="btn soft" type="button">REFRESH</button></div>
    <div id="pickupOrdersMessage" hidden style="margin-top:12px" aria-live="polite"></div>
    <div id="pickupOrdersList" class="pickup-orders-list" style="margin-top:14px"><div class="pickup-empty">Loading your orders…</div></div>
  </section>
  <div style="margin-top:16px"><a class="btn soft" href="customer-menu.html">Back to menu</a></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.0"></script>
<script src="../assets/tenant-config.js?v=20261021-top-menu"></script>
<script src="../assets/tenant-branding.js?v=20261021-top-menu"></script>
<script src="../assets/customer-navigation.js?v=20261021-top-menu"></script>
<script src="../assets/config.js?v=20261019-currency-egp"></script>
<script src="../assets/app.js?v=20261021-top-menu"></script>
<script src="../assets/pickup-orders.js?v=20261021-top-menu"></script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('../sw.js').catch(()=>{}));}</script>
</body>
</html>
