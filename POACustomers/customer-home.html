<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#FFF4ED">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../assets/icons/icon-192.png?v=20261024-home-image-cards-v1">
<title>Customer Home</title>
<link rel="stylesheet" href="../assets/style.css?v=20261026-offers-page-v1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dina's Corner">
</head>
<body data-page="customer-home">

<header class="topbar customer-topbar">
<a class="brand brand-image" href="customer-home.html" aria-label="Dina's Corner Home"><img class="brand-logo" src="../assets/dina-corner-icon.png?v=20261024-home-image-cards-v1" alt="DINA'S CORNER"></a>
<a class="customer-header-points" href="customer-card.html" title="Open your loyalty card" aria-label="Open your loyalty card">
  <svg class="customer-header-points__icon" aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path d="m12 2.8 2.75 5.57 6.15.89-4.45 4.34 1.05 6.12L12 16.83l-5.5 2.89 1.05-6.12L3.1 9.26l6.15-.89L12 2.8Z"/></svg>
  <strong><span data-points>0</span><span class="customer-header-points__divider">/</span>50</strong>
  <span class="customer-header-points__label">PTS</span>
</a>
<details class="customer-top-menu" data-customer-top-menu>
  <summary aria-label="Open customer navigation" title="Open customer navigation"><svg class="customer-top-menu-symbol" aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path d="M4 6h16M4 12h16M4 18h16" /></svg></summary>
  <nav class="customer-menu-popup" aria-label="Customer menu">
    <a href="customer-home.html" data-customer-link><span aria-hidden="true" class="customer-menu-icon">⌂</span><span>Home</span></a>
    <a href="customer-menu.html" data-customer-link><span aria-hidden="true" class="customer-menu-icon">☰</span><span>Menu &amp; Basket</span></a>
    <a href="customer/customer-offers.html" data-customer-link><span aria-hidden="true" class="customer-menu-icon">★</span><span>Offers</span></a>
    <a href="customer-card.html" data-customer-link><span aria-hidden="true" class="customer-menu-icon">▦</span><span>My QR Code</span></a>
    <a href="customer-rewards.html" data-customer-link><span aria-hidden="true" class="customer-menu-icon">★</span><span>Rewards</span></a>
    <a href="customer-locations.html" data-customer-link><span aria-hidden="true" class="customer-menu-icon">⌖</span><span>Branches</span></a>
    <a href="customer-order-history.html" data-customer-link><span aria-hidden="true" class="customer-menu-icon">▣</span><span>Order History</span></a>
    <a href="customer-profile.html" data-customer-link><span aria-hidden="true" class="customer-menu-icon">●</span><span>My Profile</span></a>
  <button class="customer-menu-logout" type="button" onclick="logout()" aria-label="Sign out">Sign Out</button></nav>
</details>
</header>
<main class="container">


<section id="homeOffersCard" class="card home-offers-card" style="margin-top:18px" aria-live="polite">
  <div id="homeOffersContent" class="home-offers-fallback" aria-live="polite">
    <h3>Special Offers</h3>
    <p class="sub">Loading current offers…</p>
  </div>
</section>

<section class="card customer-home-shortcuts" aria-labelledby="homeShortcutsTitle">
  <div class="home-shortcuts-heading">
    <h3 id="homeShortcutsTitle">Quick Access</h3>
  </div>
  <div class="customer-home-quick-actions customer-home-quick-actions--images">
    <a class="customer-home-quick-action customer-home-quick-action--image" href="customer-menu.html">
      <span class="customer-home-quick-action__image"><img src="../assets/home-cards/menu.jpg?v=20261024-home-image-cards-v1" alt="" loading="lazy" decoding="async"></span>
      <span class="customer-home-quick-action__body"><span class="customer-home-quick-action__copy"><strong>Menu</strong><small>Browse all items</small></span><span class="customer-home-quick-action__arrow" aria-hidden="true">›</span></span>
    </a>
    <a class="customer-home-quick-action customer-home-quick-action--image" href="customer-profile.html">
      <span class="customer-home-quick-action__image"><img src="../assets/home-cards/profile.jpg?v=20261024-home-image-cards-v1" alt="" loading="lazy" decoding="async"></span>
      <span class="customer-home-quick-action__body"><span class="customer-home-quick-action__copy"><strong>My Profile</strong><small>Personal details</small></span><span class="customer-home-quick-action__arrow" aria-hidden="true">›</span></span>
    </a>
    <a class="customer-home-quick-action customer-home-quick-action--image" href="customer-locations.html">
      <span class="customer-home-quick-action__image"><img src="../assets/home-cards/locations.jpg?v=20261024-home-image-cards-v1" alt="" loading="lazy" decoding="async"></span>
      <span class="customer-home-quick-action__body"><span class="customer-home-quick-action__copy"><strong>Locations</strong><small>Find a branch</small></span><span class="customer-home-quick-action__arrow" aria-hidden="true">›</span></span>
    </a>
    <a class="customer-home-quick-action customer-home-quick-action--image" href="customer-card.html">
      <span class="customer-home-quick-action__image"><img src="../assets/home-cards/loyalty-qr.jpg?v=20261024-home-image-cards-v1" alt="" loading="lazy" decoding="async"></span>
      <span class="customer-home-quick-action__body"><span class="customer-home-quick-action__copy"><strong>My QR Code</strong><small>Share loyalty code</small></span><span class="customer-home-quick-action__arrow" aria-hidden="true">›</span></span>
    </a>
    <a class="customer-home-quick-action customer-home-quick-action--image" href="customer/customer-offers.html">
      <span class="customer-home-quick-action__image"><img src="../assets/home-cards/offers.jpg?v=20261024-home-image-cards-v1" alt="" loading="lazy" decoding="async"></span>
      <span class="customer-home-quick-action__body"><span class="customer-home-quick-action__copy"><strong>Offers</strong><small>See special offers</small></span><span class="customer-home-quick-action__arrow" aria-hidden="true">›</span></span>
    </a>
  </div>
</section>

</main>

</body>
</html>
