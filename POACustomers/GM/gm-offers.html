<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#C65F78"><link rel="manifest" href="../manifest.webmanifest"><title>Offers Management</title><link rel="stylesheet" href="../assets/style.css?v=20261022-unified-routing-order-points-v1"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.0"></script><script src="../assets/tenant-config.js?v=20261019-tenant-config"></script><script src="../assets/tenant-branding.js?v=20261019-tenant-branding"></script>
</head><body data-page="gm-offers"><header class="topbar"><a class="brand brand-image" href="gm-dashboard.html"><img class="brand-logo" src="../assets/dina-corner-icon.png" alt="DINA'S CORNER"></a><button class="icon" onclick="logout()">↪</button></header><main class="container"><h1 class="title">Offers Management</h1><p class="sub">Manage products and offer date limits.</p>
<div class="card"><h3>Add / Edit Offer</h3>
<div class="field"><label>Product Name</label><input class="input" id="gmOfferName" placeholder="Product name"></div>
<div class="field"><label>Description</label><input class="input" id="gmOfferDescription" placeholder="Offer description"></div>
<div class="field"><label>Production Date</label><input class="input" id="gmOfferProduction" type="date"></div>
<div class="field"><label>Expiry Date</label><input class="input" id="gmOfferExpiry" type="date"></div>
<div class="field"><label>Product Image</label><input class="input" id="gmOfferImage" type="file" accept="image/*"><small class="sub">You can choose a product photo from the computer.</small></div>
<div class="field"><label>Status</label><select class="input" id="gmOfferStatus"><option value="active">Active</option><option value="inactive">Inactive</option></select></div>
<button class="btn primary block" id="saveOfferBtn">SAVE OFFER</button>
<div id="offerMsg" class="note">Products are saved with production and expiry dates.</div></div>
<div class="card"><h3>Current Offers</h3><div id="gmOffersList"><div class="empty">Loading offers…</div></div></div>
</main><nav class="nav"><div class="navin"><a href="gm-dashboard.html"><b>▦</b>Dashboard</a><a href="gm-menu.html"><b>☰</b>Menu</a><a href="gm-settings.html" class="active"><b>⚙</b>Settings</a></div></nav>
