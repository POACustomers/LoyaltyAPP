<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#C65F78">
<link rel="manifest" href="../manifest.webmanifest">
<title>Offers Management</title>
<link rel="stylesheet" href="../assets/style.css?v=20261024-presale-candidate">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.0"></script>
<script src="../assets/tenant-config.js?v=20261024-presale-candidate"></script>
<script src="../assets/tenant-branding.js?v=20261024-presale-candidate"></script>
<style>
.offer-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0 0}
.offer-admin-row{display:flex;align-items:flex-start;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.offer-admin-row:last-child{border-bottom:0}
.offer-admin-image{width:76px;height:76px;flex:0 0 76px;object-fit:cover;border:1px solid var(--line);border-radius:14px;background:#f8eee8}
.offer-admin-content{flex:1;min-width:0}
.offer-admin-content strong{display:block;color:var(--green);font-size:15px;overflow-wrap:anywhere}
.offer-admin-content small{display:block;color:var(--muted);line-height:1.55;margin-top:5px;overflow-wrap:anywhere}
.offer-admin-buttons{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.offer-admin-buttons .btn{min-height:36px;padding:8px 12px;font-size:12px}
.offer-editing-note{margin-top:8px;font-size:12px;color:var(--muted)}
@media(max-width:520px){.offer-admin-row{gap:9px}.offer-admin-image{width:58px;height:58px;flex-basis:58px}.offer-admin-buttons .btn{flex:1}}
</style>
</head>
<body data-page="gm-offers">
<header class="topbar"><a class="brand brand-image" href="gm-dashboard.html"><img class="brand-logo" src="../assets/dina-corner-icon.png?v=20261024-presale-candidate" alt="DINA'S CORNER"></a><button class="icon" onclick="logout()" aria-label="Sign out">↪</button></header>
<main class="container">
  <h1 class="title">Offers Management</h1>
  <p class="sub">Create, edit, pause, or delete customer offers.</p>
  <div class="card" id="offerFormCard">
    <h3 id="offerFormHeading">Add Offer</h3>
    <input id="gmOfferId" type="hidden" value="">
    <div class="field"><label for="gmOfferName">Product Name *</label><input class="input" id="gmOfferName" placeholder="Product name" maxlength="160" required></div>
    <div class="field"><label for="gmOfferDescription">Description</label><input class="input" id="gmOfferDescription" placeholder="Offer description" maxlength="500"></div>
    <div class="field"><label for="gmOfferProduction">Production Date *</label><input class="input" id="gmOfferProduction" type="date" required></div>
    <div class="field"><label for="gmOfferExpiry">Expiry Date *</label><input class="input" id="gmOfferExpiry" type="date" required></div>
    <div class="field"><label for="gmOfferImage">Product Image</label><input class="input" id="gmOfferImage" type="file" accept="image/*"><small class="sub">Optional. Leave empty while editing to keep the current image. Maximum 5 MB.</small><div class="offer-editing-note" id="offerCurrentImage"></div></div>
    <div class="field"><label for="gmOfferStatus">Status</label><select class="input" id="gmOfferStatus"><option value="active">Active</option><option value="inactive">Inactive</option></select></div>
    <button class="btn primary block" id="saveOfferBtn" type="button">SAVE OFFER</button>
    <div class="offer-tools"><button class="btn soft" id="cancelEditBtn" type="button" hidden>CANCEL EDIT</button></div>
    <div id="offerMsg" class="note" role="status" aria-live="polite">Offers are saved with production and expiry dates.</div>
  </div>
  <div class="card">
    <div class="row" style="justify-content:space-between;gap:10px;flex-wrap:wrap"><h3 style="margin:0">Current Offers</h3><button class="btn soft" id="refreshOffersBtn" type="button">REFRESH</button></div>
    <div id="gmOffersList" aria-live="polite"><div class="empty">Loading offers…</div></div>
  </div>
</main>
<nav class="nav"><div class="navin"><a href="gm-dashboard.html"><b>▦</b>Dashboard</a><a href="gm-menu.html"><b>☰</b>Menu</a><a href="gm-settings.html" class="active"><b>⚙</b>Settings</a></div></nav>
<script src="../assets/config.js?v=20261024-presale-candidate"></script>
<script src="../assets/app.js?v=20261024-presale-candidate"></script>
<script>
(async function () {
  'use strict';
  const $ = id => document.getElementById(id);
  const msg = $('offerMsg');
  const list = $('gmOffersList');
  const saveBtn = $('saveOfferBtn');
  const refreshBtn = $('refreshOffersBtn');
  const cancelBtn = $('cancelEditBtn');
  let activeProfile = null;
  let offerRows = [];
  let editingOffer = null;

  function esc(value) {
    return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));
  }
  function setMessage(text, kind) {
    msg.textContent = text;
    msg.className = 'note' + (kind === 'error' ? ' alert' : kind === 'success' ? ' ok' : '');
  }
  function withTimeout(promise, milliseconds, text) {
    let timer;
    return Promise.race([
      Promise.resolve(promise),
      new Promise((_, reject) => { timer = setTimeout(() => reject(new Error(text)), milliseconds); })
    ]).finally(() => clearTimeout(timer));
  }
  async function fileToDataUrl(file) {
    if (!file || !file.type.startsWith('image/')) throw new Error('Please choose a valid image file.');
    if (file.size > 5 * 1024 * 1024) throw new Error('Image must be 5 MB or smaller.');
    const raw = await new Promise((resolve, reject) => {
      const reader = new FileReader(); reader.onload = () => resolve(reader.result); reader.onerror = () => reject(new Error('Could not read image.')); reader.readAsDataURL(file);
    });
    const image = await new Promise((resolve, reject) => {
      const item = new Image(); item.onload = () => resolve(item); item.onerror = () => reject(new Error('The selected image is invalid.')); item.src = raw;
    });
    const max = 900, scale = Math.min(1, max / Math.max(image.width, image.height));
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(image.width * scale)); canvas.height = Math.max(1, Math.round(image.height * scale));
    canvas.getContext('2d').drawImage(image, 0, 0, canvas.width, canvas.height);
    return canvas.toDataURL('image/jpeg', 0.82);
  }
  function render(rows) {
    offerRows = Array.isArray(rows) ? rows : [];
    if (!offerRows.length) {
      list.innerHTML = '<div class="empty">No offers were returned for this account. Check that you are signed in as GM/Admin and that offer access policies are installed.</div>';
      return;
    }
    list.innerHTML = offerRows.map(offer => {
      const name = offer.product_name || offer.title || 'Untitled offer';
      const image = offer.image_url ? `<img class="offer-admin-image" src="${esc(offer.image_url)}" alt="${esc(name)}">` : '<div class="offer-admin-image" aria-hidden="true" style="display:grid;place-items:center;color:var(--muted)">No image</div>';
      return `<article class="offer-admin-row">${image}<div class="offer-admin-content"><strong>${esc(name)}</strong><small>${esc(offer.description || 'No description')}<br>Production: ${esc(offer.production_date || '—')} · Expiry: ${esc(offer.expiry_date || '—')}</small><div style="margin-top:6px"><span class="badge">${esc(offer.status || 'unknown')}</span></div><div class="offer-admin-buttons"><button class="btn soft" type="button" data-offer-action="edit" data-offer-id="${esc(offer.id)}">EDIT</button><button class="btn danger" type="button" data-offer-action="delete" data-offer-id="${esc(offer.id)}">DELETE</button></div></div></article>`;
    }).join('');
  }
  async function loadOffers() {
    list.innerHTML = '<div class="empty">Loading offers…</div>';
    refreshBtn.disabled = true;
    try {
      const result = await withTimeout(
        sb.from('offers').select('id,title,product_name,description,production_date,expiry_date,image_url,status,created_at').order('created_at', {ascending:false}),
        15000,
        'Loading offers timed out. Check your internet connection and Supabase status, then press Refresh.'
      );
      if (result.error) throw result.error;
      render(result.data || []);
      if (!result.data?.length) setMessage('The offers table was reached, but no rows are visible to this account.', '');
    } catch (error) {
      list.innerHTML = `<div class="alert">Could not load offers: ${esc(error?.message || error || 'Unknown error')}<br><br>If you see a permissions/RLS error, run the included offers edit/delete policy SQL in the correct Supabase project.</div>`;
      setMessage('Offers could not be loaded. See the message under Current Offers.', 'error');
    } finally {
      refreshBtn.disabled = false;
    }
  }
  function resetForm() {
    editingOffer = null;
    $('gmOfferId').value = '';
    $('gmOfferName').value = '';
    $('gmOfferDescription').value = '';
    $('gmOfferProduction').value = '';
    $('gmOfferExpiry').value = '';
    $('gmOfferImage').value = '';
    $('gmOfferStatus').value = 'active';
    $('offerCurrentImage').textContent = '';
    $('offerFormHeading').textContent = 'Add Offer';
    saveBtn.textContent = 'SAVE OFFER';
    cancelBtn.hidden = true;
  }
  function startEdit(id) {
    const offer = offerRows.find(row => String(row.id) === String(id));
    if (!offer) { setMessage('This offer is no longer in the list. Press Refresh and try again.', 'error'); return; }
    editingOffer = offer;
    $('gmOfferId').value = offer.id;
    $('gmOfferName').value = offer.product_name || offer.title || '';
    $('gmOfferDescription').value = offer.description || '';
    $('gmOfferProduction').value = offer.production_date || '';
    $('gmOfferExpiry').value = offer.expiry_date || '';
    $('gmOfferImage').value = '';
    $('gmOfferStatus').value = offer.status === 'inactive' ? 'inactive' : 'active';
    $('offerCurrentImage').textContent = offer.image_url ? 'Current image saved. Choose another image only if you want to replace it.' : 'This offer has no saved image.';
    $('offerFormHeading').textContent = 'Edit Offer';
    saveBtn.textContent = 'UPDATE OFFER';
    cancelBtn.hidden = false;
    setMessage(`Editing: ${offer.product_name || offer.title || 'offer'}. Save to apply your changes.`, '');
    $('offerFormCard').scrollIntoView({behavior:'smooth', block:'start'});
  }
  saveBtn.addEventListener('click', async () => {
    if (!activeProfile) { setMessage('Please sign in with an active GM/Admin account again.', 'error'); return; }
    const product_name = $('gmOfferName').value.trim();
    const description = $('gmOfferDescription').value.trim();
    const production_date = $('gmOfferProduction').value;
    const expiry_date = $('gmOfferExpiry').value;
    const status = $('gmOfferStatus').value;
    if (!product_name || !production_date || !expiry_date) { setMessage('Product name, production date, and expiry date are required.', 'error'); return; }
    if (expiry_date < production_date) { setMessage('Expiry date cannot be before production date.', 'error'); return; }
    saveBtn.disabled = true;
    const originalLabel = saveBtn.textContent;
    saveBtn.textContent = editingOffer ? 'UPDATING…' : 'SAVING…';
    try {
      const file = $('gmOfferImage').files?.[0];
      const image_url = file ? await fileToDataUrl(file) : (editingOffer?.image_url || null);
      const payload = {
        title: product_name,
        product_name,
        description: description || null,
        production_date,
        expiry_date,
        image_url,
        status,
        updated_at: new Date().toISOString()
      };
      let result;
      if (editingOffer) {
        result = await sb.from('offers').update(payload).eq('id', editingOffer.id).select('id');
      } else {
        result = await sb.from('offers').insert({...payload, created_by: activeProfile.id}).select('id');
      }
      if (result.error) throw result.error;
      if (editingOffer && !result.data?.length) throw new Error('No offer was updated. Check GM/Admin permissions in Supabase.');
      setMessage(editingOffer ? 'Offer updated successfully.' : 'Offer created successfully.', 'success');
      resetForm();
      await loadOffers();
    } catch (error) {
      setMessage(`Could not save offer: ${error?.message || error}`, 'error');
    } finally {
      saveBtn.disabled = false;
      saveBtn.textContent = editingOffer ? 'UPDATE OFFER' : originalLabel;
      if (!editingOffer && $('gmOfferId').value === '') saveBtn.textContent = 'SAVE OFFER';
    }
  });
  cancelBtn.addEventListener('click', () => { resetForm(); setMessage('Edit cancelled.', ''); });
  refreshBtn.addEventListener('click', loadOffers);
  list.addEventListener('click', async event => {
    const button = event.target.closest('button[data-offer-action]');
    if (!button) return;
    const id = button.dataset.offerId;
    if (button.dataset.offerAction === 'edit') { startEdit(id); return; }
    if (button.dataset.offerAction === 'delete') {
      const offer = offerRows.find(row => String(row.id) === String(id));
      if (!offer) { setMessage('Offer not found in the current list. Press Refresh.', 'error'); return; }
      const name = offer.product_name || offer.title || 'this offer';
      if (!window.confirm(`Delete "${name}"? This cannot be undone.`)) return;
      button.disabled = true;
      try {
        const result = await sb.from('offers').delete().eq('id', id).select('id');
        if (result.error) throw result.error;
        if (!result.data?.length) throw new Error('No offer was deleted. Check GM/Admin permissions in Supabase.');
        if (editingOffer && String(editingOffer.id) === String(id)) resetForm();
        setMessage('Offer deleted successfully.', 'success');
        await loadOffers();
      } catch (error) {
        setMessage(`Could not delete offer: ${error?.message || error}. If this is an RLS/permission error, run the included SQL policy update.`, 'error');
        button.disabled = false;
      }
    }
  });

  try {
    if (typeof sb === 'undefined' || !sb) throw new Error('Supabase client is not configured. Check assets/config.js.');
    list.innerHTML = '<div class="empty">Checking GM/Admin access…</div>';
    activeProfile = await withTimeout(guardRole(['gm','admin']), 15000, 'Checking access timed out. Refresh the page and sign in again.');
    if (!activeProfile) {
      list.innerHTML = '<div class="alert">No active GM/Admin profile was returned. Sign in again with a GM/Admin account.</div>';
      return;
    }
    await loadOffers();
  } catch (error) {
    list.innerHTML = `<div class="alert">Could not open offer management: ${esc(error?.message || error)}. Refresh the page; if it continues, check the Supabase login/session and table policies.</div>`;
    setMessage('Offer management did not initialize. See the Current Offers message.', 'error');
  }
})();
</script>

</body>
</html>
