<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#C65F78">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Dina's Corner Loyalty</title>
<link rel="stylesheet" href="assets/style.css?v=20261022-unified-login">
<script src="assets/tenant-config.js?v=20261022-unified-login"></script>
<script src="assets/tenant-branding.js?v=20261022-unified-login"></script>
</head>
<body data-page="public-login">
<main class="container">
<div class="auth" style="min-height:calc(100vh - 48px);padding:0;background:transparent">
<div class="authbox center">
<div class="logo"><img class="official-logo" src="assets/dina-corner-logo.png" alt="DINA'S CORNER"></div>
<h2>DINA'S CORNER LOYALTY</h2>
<p class="sub">Good Food • Brighter Moments</p>
<form id="unifiedLoginForm" style="text-align:right;margin-top:22px">
<div class="field">
<label for="username">اسم المستخدم أو البريد الإلكتروني</label>
<input id="username" class="input" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="اكتب اسم المستخدم" required>
</div>
<div class="field">
<label for="password">كلمة المرور</label>
<input id="password" class="input" name="password" type="password" autocomplete="current-password" placeholder="اكتب كلمة المرور" required>
</div>
<button id="loginBtn" type="submit" class="btn primary block">تسجيل الدخول</button>
<div id="msg" class="note" role="status" aria-live="polite" hidden></div>
</form>
<div class="center" style="margin-top:16px">
<p class="sub">أول مرة تستخدم التطبيق؟</p>
<a href="customer/customer-register.html" class="btn soft block">إنشاء حساب جديد</a>
</div>
</div>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.0"></script>
<script src="assets/config.js?v=20261022-unified-login"></script>
<script src="assets/app.js?v=20261022-unified-login"></script>
</body>
</html>
