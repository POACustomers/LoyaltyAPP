<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff0f1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dina's Corner">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest?v=20261115-home-height-back-restore-v1">
<link rel="apple-touch-icon" href="assets/dina-corner-icon-192.png">
<meta name="color-scheme" content="light">
<meta name="description" content="Dina's Corner — view our menu and rate your experience.">
<title>Dina's Corner | Welcome</title>
<link rel="stylesheet" href="assets/dina-welcome.css?v=20261115-home-height-back-restore-v1">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.0"></script>
<script src="assets/tenant-config.js?v=20261113-integrated-bg-v6"></script>
</head>
<body class="dc-welcome-page dc-artwork-mode">
<main class="dc-artwork-page" aria-label="Dina’s Corner welcome page">
  <img class="dc-artwork-image" src="assets/dina-welcome-approved-artwork.jpg?v=20261113-final-v10" alt="Dina’s Corner welcome page with menu, evaluation, payment and Instagram information">

  <a class="dc-artwork-hotspot dc-hotspot-menu" id="viewMenuLink" href="menu.html" aria-label="View Our Menu"></a>
  <button class="dc-artwork-hotspot dc-hotspot-review" id="evaluateButton" type="button" aria-label="Evaluate Us" aria-haspopup="dialog" aria-controls="branchDialog"></button>
  <a class="dc-artwork-hotspot dc-hotspot-instapay" href="#" onclick="copyPaymentNumber('01282471226'); return false;" aria-label="Copy InstaPay number"></a>
  <a class="dc-artwork-hotspot dc-hotspot-vodafone" href="#" onclick="copyPaymentNumber('01002348055'); return false;" aria-label="Copy Vodafone Cash number"></a>

  <div id="copyToast" class="copy-toast">Copied Successfully!</div>

  <script>
  async function copyPaymentNumber(number) {
      try {
          await navigator.clipboard.writeText(number);
          const toast = document.getElementById('copyToast');
          toast.classList.add('show');
          clearTimeout(window.copyToastTimer);
          window.copyToastTimer = setTimeout(() => {
              toast.classList.remove('show');
          }, 2000);
      } catch (error) {
          alert('Copy failed. Please try again.');
      }
  }
  </script>

  <style>
  .copy-toast {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      background: #263b38;
      color: white;
      padding: 12px 24px;
      border-radius: 25px;
      font-size: 14px;
      opacity: 0;
      visibility: hidden;
      transition: 0.3s;
      z-index: 99999;
  }
  .copy-toast.show {
      opacity: 1;
      visibility: visible;
  }
  </style>

  <a class="dc-artwork-hotspot dc-hotspot-instagram" href="https://www.instagram.com/dinas_corner_healthy?vrfl=MWVqN2J4ejN4M2F5cA==" target="_blank" rel="noopener noreferrer" aria-label="Follow Dina’s Corner on Instagram"></a>
</main>

<div class="dc-dialog-backdrop" id="branchDialog" hidden>
  <section class="dc-dialog" role="dialog" aria-modal="true" aria-labelledby="branchDialogTitle">
    <button class="dc-dialog-close" id="closeBranchDialog" type="button" aria-label="Close">×</button>
    <p class="dc-dialog-kicker">YOUR EXPERIENCE MATTERS</p>
    <h2 id="branchDialogTitle">Choose your branch</h2>
    <p class="dc-dialog-subtitle">Select the Dina’s Corner branch you visited.</p>
    <div id="branchList" class="dc-branch-list"><div class="dc-branch-loading">Choose a branch to continue.</div></div>
    <p class="dc-dialog-error" id="branchError" role="status" hidden></p>
  </section>
</div>

<script src="assets/config.js?v=20261113-integrated-bg-v6"></script>
<script src="assets/app.js?v=20261113-integrated-bg-v6"></script>
<script src="assets/dina-welcome.js?v=20261113-final-artwork-v10"></script>
</body>
</html>
