<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>GM Dashboard — Dina's Corner</title>

<style>
/* Page-specific GM Settings design approved in the preview. */
body.gm-settings-page{
  min-height:100vh;
  padding:0 0 28px;
  color:#75183d;
  background:linear-gradient(145deg,#fff8f8 0%,#fdeef1 52%,#fff7f6 100%);
  overflow-x:hidden;
}
body.gm-settings-page::before,
body.gm-settings-page::after{
  content:"";
  position:absolute;
  top:0;
  z-index:0;
  width:clamp(82px,14vw,160px);
  height:clamp(100px,17vw,180px);
  background-repeat:no-repeat;
  background-size:contain;
  pointer-events:none;
}
body.gm-settings-page::before{
  left:0;
  background-image:url("../assets/dina-floral-tl.png");
  background-position:top left;
}
body.gm-settings-page::after{
  right:0;
  background-image:url("../assets/dina-floral-tr.png");
  background-position:top right;
}
.gm-settings-container{
  position:relative;
  z-index:1;
  width:min(100%,1280px);
  margin:0 auto;
  padding:10px clamp(18px,2.6vw,34px) 28px;
}
.gm-settings-logo-wrap{
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:220px;
  padding:4px 0 54px;
}
.gm-settings-logo{
  display:block;
  width:clamp(150px,18vw,220px);
  max-height:210px;
  object-fit:contain;
  border:0;
  border-radius:0;
  box-shadow:none;
  background:transparent;
}
.gm-settings-profile-row{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:22px;
  width:100%;
  margin:0 auto 28px;
}
.gm-settings-avatar{
  width:clamp(116px,13vw,164px);
  height:clamp(116px,13vw,164px);
  flex:0 0 auto;
  overflow:hidden;
  border:4px solid #fff;
  border-radius:50%;
  background:#f8dfe6;
  box-shadow:0 5px 16px rgba(128,34,67,.16);
}
.gm-settings-avatar img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
}
.gm-settings-actions{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:18px;
  flex-wrap:wrap;
}
.gm-settings-actions .btn{
  min-height:72px;
  border-radius:28px;
  padding:14px 25px;
  font-size:clamp(13px,1.4vw,18px);
  font-weight:900;
  letter-spacing:.15px;
  white-space:nowrap;
  box-shadow:0 5px 13px rgba(128,34,67,.10);
}
.gm-settings-actions .gm-photo-btn{
  min-width:clamp(230px,27vw,350px);
  color:#811b43;
  background:linear-gradient(180deg,#fffafb,#fff0f3);
  border:2px solid #e58aa5;
}
.gm-settings-actions .gm-logout-btn{
  min-width:clamp(160px,18vw,220px);
  color:#fff;
  background:linear-gradient(135deg,#c82e5b,#9f1745);
  border:1px solid #a91849;
}
.gm-settings-actions .btn:disabled{opacity:.65;cursor:wait}
.gm-settings-actions svg{
  width:23px;
  height:23px;
  flex:0 0 auto;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.gm-settings-photo-msg{
  width:min(100%,720px);
  min-height:0;
  margin:0 auto 20px;
  padding:0;
  color:#8e3656;
  background:transparent;
  text-align:center;
  font-size:12px;
}
.gm-settings-divider{
  height:1px;
  width:100%;
  margin:10px auto 48px;
  background:linear-gradient(90deg,transparent,#d98ba2 12%,#d98ba2 88%,transparent);
}
.gm-settings-heading{
  margin:0 0 40px;
  color:#741639;
  text-align:center;
  font:800 clamp(30px,4.2vw,54px)/1.15 Georgia,serif;
}
.gm-settings-heading::after{
  content:"";
  display:block;
  width:clamp(170px,28vw,330px);
  height:16px;
  margin:20px auto 0;
  background:linear-gradient(90deg,transparent 0%,#9c234b 20%,#9c234b 42%,transparent 42%,transparent 58%,#9c234b 58%,#9c234b 80%,transparent 100%);
  clip-path:polygon(0 45%,46% 45%,50% 0,54% 45%,100% 45%,100% 58%,54% 58%,50% 100%,46% 58%,0 58%);
}
.gm-settings-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:clamp(14px,2.2vw,28px);
}
.gm-settings-tile{
  min-width:0;
  min-height:clamp(150px,17vw,220px);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:16px;
  padding:20px 12px;
  border:1.5px solid #dfa5b5;
  border-radius:28px;
  color:#76183d;
  background:linear-gradient(145deg,rgba(255,255,255,.88),rgba(255,246,247,.94));
  box-shadow:0 8px 18px rgba(115,32,62,.08),inset 0 1px 0 rgba(255,255,255,.9);
  text-align:center;
  text-decoration:none;
  transition:transform .15s ease,box-shadow .15s ease;
}
.gm-settings-tile:hover{
  transform:translateY(-2px);
  box-shadow:0 11px 22px rgba(115,32,62,.12);
}
.gm-settings-tile:focus-visible{
  outline:3px solid #cf5d80;
  outline-offset:3px;
}
.gm-settings-tile svg{
  display:block;
  width:clamp(38px,5vw,58px);
  height:clamp(38px,5vw,58px);
  fill:none;
  stroke:#c52e5c;
  stroke-width:2.5;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.gm-settings-tile strong{
  display:block;
  color:#701638;
  font:700 clamp(17px,2.2vw,28px)/1.2 Georgia,serif;
  overflow-wrap:anywhere;
}
@media(max-width:700px){
  .gm-settings-logo-wrap{min-height:185px;padding-bottom:36px}
  .gm-settings-profile-row{gap:16px;flex-wrap:wrap;margin-bottom:24px}
  .gm-settings-avatar{width:112px;height:112px}
  .gm-settings-actions{gap:10px}
  .gm-settings-actions .btn{min-height:58px;border-radius:22px;padding:12px 17px;font-size:13px}
  .gm-settings-actions .gm-photo-btn{min-width:220px}
  .gm-settings-actions .gm-logout-btn{min-width:145px}
  .gm-settings-divider{margin-bottom:34px}
  .gm-settings-heading{margin-bottom:28px}
  .gm-settings-tile{border-radius:22px;min-height:150px;gap:12px}
}
@media(max-width:480px){
  .gm-settings-container{padding-left:13px;padding-right:13px}
  .gm-settings-logo-wrap{min-height:166px;padding-bottom:26px}
  .gm-settings-logo{width:148px;max-height:150px}
  .gm-settings-profile-row{gap:12px}
  .gm-settings-actions{width:100%;gap:9px}
  .gm-settings-actions .gm-photo-btn{min-width:0;flex:1 1 205px}
  .gm-settings-actions .gm-logout-btn{min-width:120px;flex:0 1 135px}
  .gm-settings-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
  .gm-settings-tile{min-height:132px;padding:15px 8px}
  .gm-settings-tile strong{font-size:17px}
  .gm-settings-tile:last-child{grid-column:1 / -1;min-height:118px}
}
</style>
</head>
<body data-page="gm-dashboard" class="gm-settings-page">
<main class="gm-settings-container">
  <div class="gm-settings-logo-wrap">
    <img class="gm-settings-logo" src="../assets/dina-corner-logo.png" alt="Dina's Corner">
  </div>

  <section class="gm-settings-profile-row" aria-label="General Manager profile">
    <div id="gmAvatar" class="gm-avatar-frame gm-settings-avatar" aria-label="Profile photo">GM</div>
    <input id="gmAvatarInput" type="file" accept="image/*" hidden>
    <div class="gm-settings-actions">
      <button id="gmAvatarBtn" class="btn soft gm-photo-btn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h3l1.5-2h7L17 7h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13" r="3.5"/></svg>
        <span>ADD / CHANGE PHOTO</span>
      </button>
      <button class="btn danger gm-logout-btn" type="button" onclick="logout()">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17l5-5-5-5M15 12H3"/><path d="M12 3h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7"/></svg>
        <span>SIGN OUT</span>
      </button>
    </div>
  </section>
  <div id="gmPhotoMsg" class="gm-settings-photo-msg" role="status" aria-live="polite"></div>

  <div class="gm-settings-divider" aria-hidden="true"></div>
  <h1 class="gm-settings-heading">Manage Sections</h1>

  <nav class="gm-settings-grid" aria-label="Management sections">
    <a class="gm-settings-tile" href="gm-menu.html">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M8 12h32M8 24h32M8 36h32"/></svg>
      <strong>Menu</strong>
    </a>
    <a class="gm-settings-tile" href="gm-categories.html">
      <svg viewBox="0 0 48 48" aria-hidden="true"><rect x="7" y="7" width="9" height="9" rx="1"/><rect x="20" y="7" width="9" height="9" rx="1"/><rect x="33" y="7" width="9" height="9" rx="1"/><rect x="7" y="20" width="9" height="9" rx="1"/><rect x="20" y="20" width="9" height="9" rx="1"/><rect x="33" y="20" width="9" height="9" rx="1"/><rect x="7" y="33" width="9" height="9" rx="1"/><rect x="20" y="33" width="9" height="9" rx="1"/><rect x="33" y="33" width="9" height="9" rx="1"/></svg>
      <strong>Categories</strong>
    </a>
    <a class="gm-settings-tile" href="gm-locations.html">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M39 20c0 11-15 24-15 24S9 31 9 20a15 15 0 1 1 30 0Z"/><circle cx="24" cy="20" r="5"/></svg>
      <strong>Branch Locations</strong>
    </a>
  </nav>
</main>
<script src="../assets/config.js?v=20261024-delivery-zones"></script>
<script src="../assets/app.js?v=20261115-gm-no-staff-home-nav"></script>

</body>
</html>
